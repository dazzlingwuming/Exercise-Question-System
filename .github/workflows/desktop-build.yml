name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/**
      - backend/**
      - frontend/**
      - data/个人题库/agent基础题目.md
      - .github/workflows/desktop-build.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - run: npm ci --no-fund
        working-directory: frontend
      - run: npm ci --no-fund
        working-directory: desktop
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python -m pytest tests -q
        working-directory: backend
      - run: npm test
        working-directory: frontend
      - run: npm test
        working-directory: desktop
      - run: npm run prepare:ui
        working-directory: desktop
      - run: npm run prepare:backend
        working-directory: desktop
      - run: node scripts/smoke-backend.cjs
        working-directory: desktop
      - run: npm run pack -- --${{ matrix.arch }}
        working-directory: desktop
      - name: Smoke test the packaged app
        run: node scripts/smoke-packaged.cjs
        working-directory: desktop
      - run: npm run dist -- --${{ matrix.arch }}
        working-directory: desktop
      - uses: actions/upload-artifact@v6
        with:
          name: Xiaojing-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .logs/desktop-smoke-*/logs/*.log
            output/playwright/desktop-*.png
          if-no-files-found: ignore
          retention-days: 7
